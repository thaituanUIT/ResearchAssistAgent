base: Qwen/Qwen2.5-0.5B-Instruct
task: sft

data:
  train: ./data/finetune/researchassist_sft_sample.jsonl
  format: alpaca
  val_split: 0.2

training:
  epochs: 1
  lr: 2e-5
  batch_size: auto
  lora:
    r: 16
    alpha: 16
  quantization: 4bit
  stream_layers: true

output: ./models/researchassist-soup
